<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Master</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3z"/>
            <path d="M16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z" opacity=".6"/>
            <path d="M19 12a7 7 0 00-5-6.7v2.1a5 5 0 010 9.2v2.1A7 7 0 0019 12z" opacity=".3"/>
          </svg>
        </div>
        <span class="logo-text">Volume Master</span>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Clear all saved settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div class="subtitle">Per-tab volume control · saved per site</div>

    <div class="slider-section">
      <div class="vol-display" id="volDisplay">
        <span id="volNumber">100</span>%
      </div>
      <div class="slider-wrap">
        <input type="range" id="volumeSlider" min="0" max="600" step="1" value="100" class="slider">
      </div>
      <div class="slider-labels">
        <span>0%</span>
        <span>600%</span>
      </div>
    </div>

    <div class="presets">
      <button class="preset-btn active" id="btnDefault" data-filter="default">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
        Default
      </button>
      <button class="preset-btn" id="btnVoice" data-filter="voice">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
        </svg>
        Voice
      </button>
      <button class="preset-btn" id="btnBass" data-filter="bass">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Bass
      </button>
    </div>

    <button class="reset-btn" id="resetBtn">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
      </svg>
      Reset to 100%
    </button>

    <div class="divider"></div>

    <div class="audio-tabs-section">
      <div class="section-label">Playing now</div>
      <div id="audioTabsList" class="audio-tabs-list">
        <div class="empty-state" id="emptyState">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 9v6h4l5 5V4L7 9H3z"/>
            <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          No audio playing
        </div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal">
      <div class="modal-title">Clear all saved settings?</div>
      <div class="modal-body">All per-site volume settings will be removed. This cannot be undone.</div>
      <div class="modal-actions">
        <button class="modal-cancel" id="modalCancel">Cancel</button>
        <button class="modal-confirm" id="modalConfirm">Clear all</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
